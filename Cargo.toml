[package]
name = "dark-privilege"
description = "Privilege Escalation Scanner"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
winresource = "0.1.17"

[package.metadata.winresource]
LegalCopyright = "Copyright © 2024"

[dependencies]
bytesize = "1.3.0"
clap = { version = "4.5.17", features = ["derive"] }
colored_json = "5.0.0"
ctrlc = "3.4.5"
enigo = "0.2.1"
env_logger = "0.11.5"
keep-active = "0.1.2"
log = "0.4.22"
serde = { version = "1.0.209", features = ["derive"] }
sysinfo = { version = "0.31.4", features = ["windows"] }
whoami = "1.5.1"
windows-version = "0.1.1"
#winresource = "0.1.17"

[dependencies.windows]
version = "0.58.0"
features = [
    "Wdk_System_SystemServices",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[lib]
# Both a static Rust library (shared by the .exe and .dll), and a dynamic .dll
crate-type = [ "rlib", "cdylib" ]
#crate-type = [ "rlib", "dylib" ]
name = "dark_privilege_lib"

# Static executable with functions embedded (no DLL)
#[[bin]]
#name = "dark-privilege-static"
#path = "src/main_static.rs"

# Dynamic executable that loads a DLL at load time via import table
[[bin]]
name = "dark-privilege-import"
#path = "src/main_import"

# Dynamic executable that loads a DLL at runtime wiht LoadLibrary/GetProcAddress
[[bin]]
name = "dark-privilege-dynamic"
#path = "src/main_dynamic"


[profile.release]
# See https://github.com/johnthagen/min-sized-rust
# XXX TODO
#debug = "full"
# Windows has pdbs, so I think this is already split?
#split-debuginfo = "packed"
# Reduce Parallel Code Generation Units to Increase Optimization
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
# 0-3, 3 is release default
# "s": optimize for binary size
# "z": optimize for binary size, but also turn off loop vectorization.
opt-level = "z"
